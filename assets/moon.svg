<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -100 200 200">
  <!-- Illustrated full moon. Maria are placed after the real near side (north up):
       Imbrium, Procellarum, Serenitatis, Tranquillitatis 静海, Crisium, Fecunditatis,
       Nectaris, Nubium, Humorum, Frigoris, plus the bright crater Tycho. -->
  <defs>
    <radialGradient id="face" cx="38%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff8e1"/>
      <stop offset=".45" stop-color="#f4dca0"/>
      <stop offset="1" stop-color="#d9a85a"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <clipPath id="disc"><circle r="99"/></clipPath>
  </defs>
  <circle r="99" fill="url(#face)"/>
  <g clip-path="url(#disc)" fill="#b0773a" fill-opacity=".48" filter="url(#soft)">
    <path d="M-78 -46 C-60 -66 -24 -70 -6 -54 C8 -40 4 -18 -10 -8 C-20 0 -30 4 -36 12 C-44 24 -46 40 -54 54 C-62 66 -78 70 -88 58 C-98 30 -98 -14 -78 -46 Z"/>  <!-- Imbrium + Procellarum -->
    <path d="M-4 -52 C10 -60 28 -54 30 -40 C42 -36 54 -28 56 -14 C58 2 48 14 34 14 C20 14 10 4 8 -8 C-2 -14 -10 -26 -10 -38 C-10 -44 -8 -48 -4 -52 Z"/>  <!-- Serenitatis + Tranquillitatis 静海 -->
    <ellipse cx="70" cy="-28" rx="12" ry="11"/>                                                                     <!-- Crisium -->
    <path d="M48 8 C62 4 72 16 68 32 C64 42 50 42 46 32 C43 24 42 14 48 8 Z"/>                                      <!-- Fecunditatis -->
    <ellipse cx="32" cy="30" rx="10" ry="10"/>                                                                      <!-- Nectaris -->
    <path d="M-34 24 C-18 18 0 26 0 42 C0 56 -18 60 -30 52 C-42 44 -44 30 -34 24 Z"/>                               <!-- Nubium -->
    <ellipse cx="-52" cy="44" rx="11" ry="10"/>                                                                     <!-- Humorum -->
    <path d="M-62 -70 C-34 -82 10 -82 44 -70 C40 -62 10 -66 -20 -63 C-40 -61 -56 -62 -62 -70 Z"/>                  <!-- Frigoris -->
  </g>
  <g clip-path="url(#disc)" stroke="#fff6dc" stroke-opacity=".18" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#soft)">
    <path d="M-10 66 L-34 30 M-10 66 L14 34 M-10 66 L-44 76 M-10 66 L26 82"/>                                     <!-- Tycho rays -->
  </g>
  <circle cx="-10" cy="66" r="3" fill="#fffaf0" fill-opacity=".75"/>
  <circle r="99" fill="none" stroke="#fff3cf" stroke-opacity=".5" stroke-width="1.5"/>
</svg>
